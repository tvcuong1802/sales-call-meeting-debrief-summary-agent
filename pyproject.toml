[project]
name = "cmn-c1-042"
version = "1.0.14"
description = "Sales Call & Meeting Debrief Summary Agent — AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    # The SDK is NOT a pyproject dependency. CI installs it itself from the private
    # registry via ${AGENTCORE_WHEEL_SPEC}, and the image installs the vendored wheel with
    # its extras in the Dockerfile. Pinning a version here only duplicates that decision --
    # and contradicts it the moment CoE moves the group-level spec, which happened on
    # 2026-09-03: every repo pinned ==1.0.1, CI asked for ==1.0.2, and `uv pip install`
    # reported "your requirements are unsatisfiable" on all of them at once.
    "pyyaml==6.0.1",
    "jsonschema==4.26.0",
    "fastapi==0.136.0",
    "uvicorn[standard]==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.10",
    "mypy==2.1.0",
    "httpx==0.28.1",
    "types-PyYAML==6.0.12.20260518",
    # jsonschema is a runtime dependency (pinned 4.26.0 above) and ships no inline types,
    # so without stubs the type-check job reports import-untyped for
    # src/nodes/crm_schema_validate.py. Stub version tracks the library pin.
    "types-jsonschema==4.26.0.20260518",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]
exclude = ["the stub harness*", "security_rules*", "tests*", "docs*"]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# disallow_subclassing_any is a per-FILE flag: it fires on the module being checked, not
# on where the base class lives, so it cannot be scoped to framework.*/shared.* via the
# overrides below. Every src/ file subclassing FunctionNode / AgentBaseGraph / AgentState
# -- the whole L1-direct architecture -- would trip it. Disabled globally; every other
# strict flag (disallow_untyped_defs, disallow_any_generics, warn_return_any, ...) stays
# on. Pattern verified on an internal merge request.
disallow_subclassing_any = false

# The agenticstar-agentcore wheel ships no py.typed marker, so mypy cannot resolve real
# types for framework.*/shared.* and every symbol from them is implicitly Any.
# ignore_missing_imports IS resolved by the imported module (unlike the flag above), so
# it can be scoped here. Checking of this template's own code is unaffected.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# src/schemas/state.py subclasses framework's AgentState. Because the wheel ships no
# py.typed, AgentState resolves to Any, so mypy does not recognise the subclass as a
# TypedDict and reports every NotRequired[...] field as [valid-type]. The declarations
# are correct -- LangGraph reads them at runtime -- so the error is an artefact of the
# untyped base class, not of this file. Scoped to this one module.
# src/retry.py imports `openai` inside try/except (ImportError, AttributeError) purely to
# use its typed RateLimitError/Timeout when a deployment happens to have the SDK. The code
# comment there states openai is NOT a required production dependency and must not be added
# to pyproject.toml, so the import cannot be made resolvable -- scoped here instead. Only the
# openai import is affected; src/retry.py's own code is still fully checked.
[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.schemas.state"]
# `unused-ignore` is scoped in alongside `valid-type` for this one module only. The class line
# carries a `# type: ignore[misc]` that is dead under disallow_subclassing_any = false above,
# but src/schemas/state.py is AST-scanned by the PB-2/PB-5 proof-of-boundary test
# (tests/proof_of_boundary/test_state_safety.py), so the fix belongs in config rather than in
# the file. Both codes here are artefacts of the untyped base class, not of this module.
disable_error_code = ["valid-type", "unused-ignore"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
